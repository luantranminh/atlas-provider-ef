name: CD - Build and Publish NuGet Package

on:
  push:
    branches:
      - master
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

env:
  # Disable the .NET logo in the console output.
  DOTNET_NOLOGO: true
  # Disable the .NET first time experience to skip caching NuGet packages and speed up the build.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending .NET CLI telemetry to Microsoft.
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Set the build number in MinVer.
  MINVERBUILDMETADATA: build.${{ github.run_number }}

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.0.0
        with:
          lfs: true
          fetch-depth: 0
      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@v3.2.0
        with:
          dotnet-version: '8.0.x'
      - name: List SDKs
        shell: pwsh
        run: dotnet --list-sdks
      - name: Dotnet Tool Restore
        shell: pwsh
        run: dotnet tool restore
      - name: Dotnet restore
        shell: pwsh
        run: dotnet restore
      - name: Dotnet Cake CI
        shell: pwsh
        run: dotnet cake --target=CI
      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: "./artifacts"

  test-tool:
    name: Test tool on ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.0.0
        with:
          lfs: true
          fetch-depth: 0
      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@v3.2.0
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: "./artifacts"
      - name: Extract version and install AtlasEF
        shell: bash
        working-directory: ./src/Atlas.Provider.Demo
        run: |
          nupkg_file=$(find ../../artifacts -name "atlas-ef.*.nupkg" ! -name "*symbols*" | head -1)
          version=$(basename "$nupkg_file" | sed 's/^atlas-ef\.//' | sed 's/\.nupkg$//')
          echo "Installing atlas-ef version: $version"
          dotnet tool install --add-source ../../artifacts --version "$version" atlas-ef
          dotnet atlas-ef --version
          dotnet atlas-ef -- sqlserver
      - name: Compare generated SQL with current_sqlserver.sql
        shell: bash
        working-directory: ./src/Atlas.Provider.Demo
        run: |
          echo "Running atlas-ef command..."
          echo "Current directory: $(pwd)"
          echo "Available tools:"
          dotnet tool list
          echo "Checking atlas-ef installation:"
          which dotnet
          dotnet --version
          echo "Attempting to run atlas-ef with verbose output..."
          echo "Testing basic atlas-ef command first..."
          dotnet atlas-ef --help > help_output.txt 2>&1 || echo "Help command failed with code $?"
          echo "Help command output:"
          cat help_output.txt
          
          echo "Now trying the actual command..."
          timeout 60 dotnet atlas-ef -- sqlserver > generated_sqlserver.sql 2>&1
          exit_code=$?
          
          echo "Command exit code: $exit_code"
          
          if [ ! -f "generated_sqlserver.sql" ]; then
            echo "Error: generated_sqlserver.sql was not created"
            exit 1
          fi
          
          echo "File exists. Size: $(wc -c < generated_sqlserver.sql) bytes"
          echo "Generated SQL content:"
          cat generated_sqlserver.sql
          
          # Only fail if the exit code was non-zero AND the file is empty
          if [ $exit_code -ne 0 ] && [ ! -s "generated_sqlserver.sql" ]; then
            echo "Command failed with exit code $exit_code and produced no output"
            exit 1
          fi
          
          if [ ! -f "current_sqlserver.sql" ]; then
            echo "Error: current_sqlserver.sql not found"
            exit 1
          fi
          
          if ! diff -q current_sqlserver.sql generated_sqlserver.sql > /dev/null; then
            echo "Differences found between current_sqlserver.sql and generated SQL:"
            diff current_sqlserver.sql generated_sqlserver.sql
            exit 1
          else
            echo "Generated SQL matches current_sqlserver.sql"
          fi
      - name: Install Atlas CLI
        uses: ariga/setup-atlas@v0
      - name: Verify Atlas CLI version
        shell: pwsh
        run: atlas version
      - name: Check migrations for sqlite
        working-directory: ./src/Atlas.Provider.Demo
        run: |
          atlas migrate diff --env ef --var dialect=sqlite
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
      - name: Verify migrations generated
        shell: bash
        run: |
          if git status --porcelain | grep -vq 'dotnet-tools.json' ; then
            echo "you need to run 'atlas migrate diff --env ef' and commit the changes"
            git --no-pager diff
            exit 1
          fi
