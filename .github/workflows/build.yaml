name: CD - Build and Publish NuGet Package

on:
  push:
    branches:
      - master
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

env:
  # Disable the .NET logo in the console output.
  DOTNET_NOLOGO: true
  # Disable the .NET first time experience to skip caching NuGet packages and speed up the build.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending .NET CLI telemetry to Microsoft.
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Set the build number in MinVer.
  MINVERBUILDMETADATA: build.${{ github.run_number }}

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.0.0
        with:
          lfs: true
          fetch-depth: 0
      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@v3.2.0
        with:
          dotnet-version: '8.0.x'
      - name: List SDKs
        shell: pwsh
        run: dotnet --list-sdks
      - name: Dotnet Tool Restore
        shell: pwsh
        run: dotnet tool restore
      - name: Dotnet restore
        shell: pwsh
        run: dotnet restore
      - name: Dotnet Cake CI
        shell: pwsh
        run: dotnet cake --target=CI
      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: "./artifacts"

  test-tool:
    name: Test tool on ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.0.0
        with:
          lfs: true
          fetch-depth: 0
      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@v3.2.0
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: "./artifacts"
      - name: Restore local tools and test AtlasEF
        shell: pwsh
        working-directory: ./src/Atlas.Provider.Demo
        run: |
          Write-Host "Clearing NuGet cache..."
          dotnet nuget locals all --clear
          
          Write-Host "Finding atlas-ef package version from artifacts..."
          $packageFile = Get-ChildItem "../../artifacts/atlas-ef.*.nupkg" | Select-Object -First 1
          if ($packageFile) {
            $packageName = $packageFile.Name
            Write-Host "Found package: $packageName"
            # Extract version from filename like atlas-ef.0.0.0-alpha.0.47.nupkg
            $version = $packageName -replace '^atlas-ef\.(.+)\.nupkg$', '$1'
            Write-Host "Extracted version: $version"
          } else {
            Write-Error "No atlas-ef package found in artifacts"
            exit 1
          }
          
          Write-Host "Uninstalling any existing atlas-ef tool..."
          try {
            dotnet tool uninstall atlas-ef
            Write-Host "Existing tool uninstalled"
          } catch {
            Write-Host "No existing tool to uninstall"
          }
          
          Write-Host "Installing atlas-ef from local artifacts..."
          dotnet tool install atlas-ef --no-cache --add-source ../../artifacts --ignore-failed-sources --version $version
          
          Write-Host "Checking local tools installation..."
          dotnet tool list
          
          Write-Host "Verifying atlas-ef installation..."
          dotnet atlas-ef --version
          
          Write-Host "Generating SQL for demo..."
          dotnet atlas-ef -- sqlserver
      - name: Compare generated SQL with current_sqlserver.sql
        shell: pwsh
        working-directory: ./src/Atlas.Provider.Demo
        run: |
          Write-Host "Running atlas-ef command..."
          dotnet atlas-ef -- sqlserver > generated_sqlserver.sql 2>&1
          
          Write-Host "Command exit code: $LASTEXITCODE"
          
          if (!(Test-Path "generated_sqlserver.sql")) {
            Write-Error "generated_sqlserver.sql was not created"
            exit 1
          }
          
          $generatedContent = Get-Content "generated_sqlserver.sql" -ErrorAction SilentlyContinue
          Write-Host "Generated SQL content:"
          if ($generatedContent) {
            $generatedContent | Write-Host
          } else {
            Write-Host "Generated file is empty or unreadable"
            Write-Host "File size: $((Get-Item 'generated_sqlserver.sql').Length) bytes"
            exit 1
          }
          
          if (!(Test-Path "current_sqlserver.sql")) {
            Write-Error "current_sqlserver.sql not found"
            exit 1
          }
          
          $currentContent = Get-Content "current_sqlserver.sql"
          $diff = Compare-Object $currentContent $generatedContent
          if ($diff) {
            Write-Host "Differences found between current_sqlserver.sql and generated SQL:"
            $diff | Format-Table
            exit 1
          } else {
            Write-Host "Generated SQL matches current_sqlserver.sql"
          }
      - name: Install Atlas CLI
        uses: ariga/setup-atlas@v0
      - name: Verify Atlas CLI version
        shell: pwsh
        run: atlas version
      - name: Check migrations for sqlite
        working-directory: ./src/Atlas.Provider.Demo
        run: |
          atlas migrate diff --env ef --var dialect=sqlite
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
      - name: Verify migrations generated
        shell: bash
        run: |
          if git status --porcelain | grep -vq 'dotnet-tools.json' ; then
            echo "you need to run 'atlas migrate diff --env ef' and commit the changes"
            git --no-pager diff
            exit 1
          fi
