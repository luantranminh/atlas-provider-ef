name: CD - Build and Publish NuGet Package

on:
  push:
    branches:
      - master
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

env:
  # Disable the .NET logo in the console output.
  DOTNET_NOLOGO: true
  # Disable the .NET first time experience to skip caching NuGet packages and speed up the build.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending .NET CLI telemetry to Microsoft.
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Set the build number in MinVer.
  MINVERBUILDMETADATA: build.${{ github.run_number }}

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.0.0
        with:
          lfs: true
          fetch-depth: 0
      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@v3.2.0
        with:
          dotnet-version: '8.0.x'
      - name: List SDKs
        shell: pwsh
        run: dotnet --list-sdks
      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Cache .NET Tools
        uses: actions/cache@v3
        with:
          path: ./.dotnet/tools
          key: ${{ runner.os }}-dotnet-tools-${{ hashFiles('.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-tools-
      - name: Cache Build Output
        uses: actions/cache@v3
        with:
          path: |
            **/obj
            **/bin
          key: ${{ runner.os }}-build-${{ hashFiles('**/*.csproj', '**/*.props') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('**/*.csproj', '**/*.props') }}-
            ${{ runner.os }}-build-
      - name: Dotnet Tool Restore
        shell: pwsh
        run: dotnet tool restore
      - name: Dotnet restore
        shell: pwsh
        run: dotnet restore
      - name: Dotnet Cake CI
        shell: pwsh
        run: dotnet cake --target=CI
      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: "./artifacts"

  test-tool:
    name: Test tool on ${{ matrix.os }} - ${{ matrix.dialect }}
    needs: build
    strategy:
      matrix:
        os: [macos-latest]
        dialect: [mysql, postgres, sqlserver, sqlite]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.0.0
        with:
          lfs: true
          fetch-depth: 0
      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@v3.2.0
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Cache .NET Tools
        uses: actions/cache@v3
        with:
          path: ./.dotnet/tools
          key: ${{ runner.os }}-dotnet-tools-${{ hashFiles('.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-tools-
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: "./artifacts"
      - name: Install AtlasEF
        shell: pwsh
        run: dotnet tool install --prerelease --add-source ./artifacts atlas-ef
      - name: Print SQL from Demo project
        shell: pwsh
        working-directory: ./src/Atlas.Provider.Demo
        run: dotnet tool restore && dotnet atlas-ef -- ${{ matrix.dialect }}
      - name: Install Atlas
        uses: ariga/setup-atlas@v0
      - name: Verify Atlas CLI version
        shell: pwsh
        run: atlas version
      - name: Set up Docker
        uses: docker/setup-docker-action@v4
      - name: Check migrations for ${{ matrix.dialect }}
        working-directory: ./src/Atlas.Provider.Demo
        run: |
          atlas migrate diff --env ef --var dialect=${{ matrix.dialect }}
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
      - name: Verify migrations generated
        shell: bash
        run: |
          if git status --porcelain | grep -vq 'dotnet-tools.json' ; then
            echo "you need to run 'atlas migrate diff --env ef' and commit the changes"
            git --no-pager diff
            exit 1
          fi
