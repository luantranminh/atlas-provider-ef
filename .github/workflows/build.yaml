name: CD - Build and Publish NuGet Package

on:
  push:
    branches:
      - master
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

env:
  # Disable the .NET logo in the console output.
  DOTNET_NOLOGO: true
  # Disable the .NET first time experience to skip caching NuGet packages and speed up the build.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending .NET CLI telemetry to Microsoft.
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Set the build number in MinVer.
  MINVERBUILDMETADATA: build.${{ github.run_number }}

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.0.0
        with:
          lfs: true
          fetch-depth: 0
      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@v3.2.0
        with:
          dotnet-version: '8.0.x'
      - name: List SDKs
        shell: pwsh
        run: dotnet --list-sdks
      - name: Dotnet Tool Restore
        shell: pwsh
        run: dotnet tool restore
      - name: Dotnet restore
        shell: pwsh
        run: dotnet restore
      - name: Dotnet Cake CI
        shell: pwsh
        run: dotnet cake --target=CI
      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: "./artifacts"

  test-tool:
    name: Test tool on ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4.0.0
        with:
          lfs: true
          fetch-depth: 0
      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@v3.2.0
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: "./artifacts"
      - name: Pack and install AtlasEF tool locally
        shell: bash
        working-directory: ./src/Atlas.Provider.Demo
        run: |
          # Uninstall existing and pack tool
          dotnet tool uninstall -g atlas-ef || true
          dotnet restore ../../src/Atlas.Provider.Loader/Atlas.Provider.Loader.csproj
          dotnet pack ../../src/Atlas.Provider.Loader/Atlas.Provider.Loader.csproj -c Release -o ./nupkg
          
          # Extract version and install
          nupkg_file=$(find ./nupkg -name "atlas-ef.*.nupkg" ! -name "*symbols*" | head -1)
          version=$(basename "$nupkg_file" | sed 's/^atlas-ef\.//' | sed 's/\.nupkg$//')
          dotnet tool install --add-source ./nupkg --version "$version" -g atlas-ef
          atlas-ef --version
      - name: Compare generated SQL with current_sqlserver.sql
        shell: bash
        working-directory: ./src/Atlas.Provider.Demo
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          
          # Generate SQL and verify
          atlas-ef -- sqlserver > generated_sqlserver.sql 2>&1
          
          if [ ! -s "generated_sqlserver.sql" ]; then
            echo "Error: Failed to generate SQL"
            exit 1
          fi
          
          if ! diff -q current_sqlserver.sql generated_sqlserver.sql > /dev/null; then
            echo "Generated SQL differs from current_sqlserver.sql:"
            diff current_sqlserver.sql generated_sqlserver.sql
            exit 1
          fi
      - name: Install Atlas CLI
        uses: ariga/setup-atlas@v0
      - name: Verify Atlas CLI version
        shell: pwsh
        run: atlas version
      - name: Check migrations for sqlite
        working-directory: ./src/Atlas.Provider.Demo
        run: |
          atlas migrate diff --env ef --var dialect=sqlite
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
      - name: Verify migrations generated
        shell: bash
        run: |
          if git status --porcelain | grep -vq 'dotnet-tools.json' ; then
            echo "you need to run 'atlas migrate diff --env ef' and commit the changes"
            git --no-pager diff
            exit 1
          fi
